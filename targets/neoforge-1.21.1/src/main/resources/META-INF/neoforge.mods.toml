modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

[[mixins]]
config = "apricityui.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},1.21.2)"
ordering = "NONE"
side = "BOTH"

# Page scripts are optional: KubeJS is preferred, standalone Rhino is the fallback,
# and with neither installed pages still render without executing scripts.
[[dependencies.${mod_id}]]
modId = "kubejs"
type = "optional"
versionRange = "[1.0.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "rhino"
type = "optional"
versionRange = "[1.0.0,)"
ordering = "NONE"
side = "BOTH"

