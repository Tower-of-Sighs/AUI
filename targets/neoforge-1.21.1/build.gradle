plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-neoforge-1.21.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// common/ is a shared source tree that also compiles standalone
// (`gradlew -p common build`, see common/build.gradle). It has no references to
// loader classes, so it can be compiled into this target by source-set sharing.
sourceSets {
    main {
        // Filter the legacy 1.20 network tree out of common for this target;
        // the target below supplies the 1.21.1 OELib network implementation.
        java.srcDir "$buildDir/generated/common-main"
        resources.srcDir '../../common/src/main/resources'
    }
    test {
        java.srcDir '../../common/src/test/java'
        resources.srcDir '../../common/src/test/resources'
    }
}

tasks.register('prepareCommonSources', Sync) {
    from('../../common/src/main/java') {
        exclude 'com/sighs/apricityui/network/**'
    }
    into "$buildDir/generated/common-main"
}
tasks.named('compileJava').configure { dependsOn 'prepareCommonSources' }

neoForge {
    version = neoforge_121_version

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    // KubeJS / Rhino (see D:\work\reference\AUI for the reference coordinates)
    maven {
        name = "Latvian"
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        name = "JitPack"
        url = "https://jitpack.io"
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'

    // Tests compile against common/, whose public API exposes Rhino types
    // (e.g. Element#addEventListener(String, Function)), so Rhino must be on
    // the test compile classpath just like in the forge-1.20.1 target.
    testImplementation "dev.latvian.mods:rhino:${rhino_121_version}"

    // Rhino is the required page runtime; KubeJS only adds optional bindings.
    // Coordinates from D:\work\reference\AUI (1.21.1 NeoForge).
    compileOnly "dev.latvian.mods:rhino:${rhino_121_version}"
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_121_version}"
    runtimeOnly "dev.latvian.mods:rhino:${rhino_121_version}"
    runtimeOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_121_version}"

    // 本地 dev 工具（spark 性能分析器等）：把 mod jar 放进 dev-libs/（gitignored）
    // 即被 client/server run 加载，不进发布产物。走本地文件而非 Modrinth maven
    // 是因为当前网络下 JVM 对 maven.neoforged.net 的 TLS 连接被重置，Gradle 8
    // 对仓库硬错误 fail-fast，任何未缓存的坐标都会解析失败。
    // spark 用法：/spark profiler --thread Render（渲染线程采样）、/spark tps、
    // /spark gcmonitor。当前放入的是 spark-1.10.124-neoforge（MC 1.21.1）。
    def devLibs = file('dev-libs')
    if (devLibs.isDirectory()) {
        def jars = devLibs.listFiles()?.findAll { it.name.endsWith('.jar') }
        if (jars) runtimeOnly files(jars)
    }
}

tasks.named('sourcesJar', Jar).configure {
    dependsOn 'prepareCommonSources'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            minecraft_version: neoforge_121_minecraft_version,
            neoforge_version: neoforge_121_version,
            neoforge_version_range: neoforge_121_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Resolvable view of the NeoForge/Minecraft runtime for the unit-test worker.
// modDevRuntimeDependencies itself is non-resolvable (canBeResolved=false), so
// extend it, mirroring the forge-1.20.1 target.
configurations {
    testRuntimeClasspath {
        // KubeJS is optional at runtime and is not needed by headless unit tests.
        // Keeping it off this classpath avoids resolving its dynamic transitives.
        exclude group: 'dev.latvian.mods', module: 'kubejs-neoforge'
        // spark 是 dev-run 专用分析器，单测 worker 不需要，排除以保持 --offline 可跑
        exclude group: 'maven.modrinth', module: 'spark'
    }
    auiTestModRuntime {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom modDevRuntimeDependencies
        exclude group: 'dev.latvian.mods', module: 'kubejs-neoforge'
        exclude group: 'maven.modrinth', module: 'spark'
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // common/ main code links against Minecraft/NeoForge classes (e.g.
    // ApricityUI.LOGGER -> LogUtils), so the unit-test worker needs the mod
    // runtime on its classpath.
    classpath += configurations.auiTestModRuntime
}

apply from: file('../../gradle/target-conventions/publish.gradle')
