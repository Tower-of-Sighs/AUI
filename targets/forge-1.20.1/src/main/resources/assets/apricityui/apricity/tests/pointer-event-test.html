<body>
<div class="page">
    <div class="hero">
        <div class="eyebrow">ApricityUI Pointer Regression</div>
        <div class="title">Pointer Event Test</div>
        <div class="summary">
            Verifies mouse compatibility mapping for pointerdown, pointermove, pointerup,
            pointerover, pointerout, pointerenter, and pointerleave.
        </div>
    </div>

    <div class="content">
        <div class="section">
            <div class="section-title">Targets</div>
            <div class="row">
                <div id="left" class="target">left target</div>
                <div id="right" class="target">right target</div>
            </div>
            <div class="note">Move between the two targets, then press and release primary mouse.</div>
        </div>

        <div class="section section-fill">
            <div class="section-title">Event Log</div>
            <div id="log" class="log"></div>
        </div>
    </div>
</div>

<script>
    (function () {
        var sequence = 0;
        var log = document.querySelector("#log");

        function pushLog(message) {
            sequence += 1;
            var line = document.createElement("div");
            line.setAttribute("class", "log-line");
            line.innerText = sequence + ". " + message;
            log.append(line);
        }

        function bind(target) {
            [
                "pointerover",
                "pointerenter",
                "pointermove",
                "pointerdown",
                "pointerup",
                "pointerout",
                "pointerleave"
            ].forEach(function (type) {
                target.addEventListener(type, function (event) {
                    pushLog(
                        target.innerText + " | " + type +
                        " | pointerId=" + event.pointerId +
                        " | pointerType=" + event.pointerType +
                        " | primary=" + event.isPrimary +
                        " | button=" + event.button
                    );
                });
            });
        }

        bind(document.querySelector("#left"));
        bind(document.querySelector("#right"));
    })();
</script>
</body>
