<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="aui-viewport" content="mode=browser">
    <title>AUI Audio Test</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #10161d;
            color: #edf6ff;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 10px;
        }

        body {
            overflow: hidden;
        }

        .page {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            color: #f8fbff;
        }

        .hint {
            color: #8fa3b8;
        }

        .card {
            background: #18222e;
            border: 1px solid #2b3a4d;
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
        }

        audio {
            width: 280px;
            height: 28px;
        }

        button {
            background: #24455f;
            color: #edf6ff;
            border: 1px solid #3a5b7a;
            border-radius: 4px;
            padding: 4px 10px;
        }

        button:hover {
            background: #2d5678;
        }

        .status {
            color: #7dd3fc;
            min-height: 12px;
        }
    </style>
</head>
<body>
<div class="page">
    <div class="title">AUI Audio Test</div>
    <div class="hint">
        把任意 OGG/WAV 放到 &lt;游戏目录&gt;/apricity/apricityui/sounds/demo.ogg 即可出声。
        Drop any OGG/WAV at &lt;gamedir&gt;/apricity/apricityui/sounds/demo.ogg to hear it.
    </div>

    <div class="card">
        <div>&lt;audio controls&gt; 控件条（点击播放键 / 拖动进度条 seek）：</div>
        <audio id="player" controls src="apricityui/sounds/demo.ogg"
               oncanplay="document.getElementById('status').textContent = 'controls: 就绪 duration=' + document.getElementById('player').duration.toFixed(2) + 's'"
               onerror="document.getElementById('status').textContent = 'controls: 加载失败（检查文件是否存在/格式是否支持）'"></audio>
    </div>

    <div class="card">
        <div>new Audio() 游离实例（JS 全控制）：</div>
        <div class="row">
            <button id="play">播放</button>
            <button id="pause">暂停</button>
            <button id="seek">跳到 50%</button>
            <button id="loop">loop: 关</button>
            <button id="mute">mute: 关</button>
        </div>
        <div class="status" id="status">idle</div>
    </div>
</div>

<script>
    var statusEl = document.getElementById("status");
    var clip = new Audio("apricityui/sounds/demo.ogg");

    function refreshLoopMute() {
        document.getElementById("loop").textContent = "loop: " + (clip.loop ? "开" : "关");
        document.getElementById("mute").textContent = "mute: " + (clip.muted ? "开" : "关");
    }

    clip.addEventListener("playing", function () { statusEl.textContent = "playing @" + clip.currentTime.toFixed(2) + "s"; });
    clip.addEventListener("pause", function () { statusEl.textContent = "paused @" + clip.currentTime.toFixed(2) + "s"; });
    clip.addEventListener("ended", function () { statusEl.textContent = "ended"; });
    clip.addEventListener("error", function () { statusEl.textContent = "new Audio: 加载失败（文件缺失或格式不支持）"; });
    clip.addEventListener("timeupdate", function () {
        if (!clip.paused) statusEl.textContent = "playing @" + clip.currentTime.toFixed(2) + " / " + clip.duration.toFixed(2) + "s";
    });

    document.getElementById("play").addEventListener("click", function () {
        clip.play()["catch"](function () { statusEl.textContent = "play() 被拒绝"; });
    });
    document.getElementById("pause").addEventListener("click", function () { clip.pause(); });
    document.getElementById("seek").addEventListener("click", function () {
        if (clip.duration > 0) clip.currentTime = clip.duration * 0.5;
    });
    document.getElementById("loop").addEventListener("click", function () { clip.loop = !clip.loop; refreshLoopMute(); });
    document.getElementById("mute").addEventListener("click", function () { clip.muted = !clip.muted; refreshLoopMute(); });

    refreshLoopMute();
</script>
</body>
</html>
