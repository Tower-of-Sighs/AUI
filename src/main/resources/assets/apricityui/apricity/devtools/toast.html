<head>
    <meta name="aui-viewport" content="mode=browser">
    <meta name="aui-font-mode" content="web">
</head>
<body>
<div id="aui-toast-list"></div>
</body>

<style>
    html {
        width: 100%;
        height: 100%;
        display: block;
    }

    body {
        width: 100%;
        height: 100%;
        pointer-events: auto;
        font-family: default;
        font-size: 13px;
        transform: translateZ(100px);
    }

    #aui-toast-list {
        position: fixed;
        top: 76px;
        right: 24px;
        width: 360px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        pointer-events: none;
    }

    .aui-toast {
        opacity: 0;
        transform: translateX(20px);
        transition: opacity 180ms ease-out, transform 180ms ease-out;
    }

    .aui-toast-visible {
        opacity: 1;
        transform: translateX(0);
    }

    .aui-toast-leaving {
        opacity: 0;
        transform: translateX(20px);
        transition-timing-function: ease-in;
    }
</style>
