<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="aui-font-mode" content="web">
    <meta name="aui-viewport" content="mode=browser">
    <title>Resource Browser Font Raster Cache Safety</title>
    <style>
        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #fafafa;
            color: #999999;
            font-family: Arial, sans-serif;
        }

        .surface {
            position: absolute;
            left: 80px;
            top: 80px;
            width: 760px;
            height: 220px;
            padding: 32px;
            background: #ffffff;
            border: 2px solid #e0e0e0;
        }

        .sample {
            position: absolute;
            display: block;
            width: 620px;
            height: 28px;
            color: #999999;
            background: #ffffff;
            white-space: nowrap;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
        }

        #cacheApply {
            left: 114px;
            top: 114px;
        }

        #cacheSkip {
            left: 114.5px;
            top: 160px;
        }

        #metrics {
            position: fixed;
            left: -100000px;
            top: 0;
            white-space: pre;
            font: 12px monospace;
            color: transparent;
        }
    </style>
</head>
<body>
<div class="surface" id="surface"></div>
<div class="sample" id="cacheApply">SELECT FILE TO VIEW DETAILS</div>
<div class="sample" id="cacheSkip">SELECT FILE TO VIEW DETAILS</div>
<pre id="metrics">BROWSER_FONT_RASTER_METRICS pending</pre>
<script>
    function rectPayload(rect) {
        return {
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height,
            right: rect.right,
            bottom: rect.bottom
        };
    }

    function stylePayload(element) {
        var style = getComputedStyle(element);
        return {
            color: style.color,
            backgroundColor: style.backgroundColor,
            fontFamily: style.fontFamily,
            fontSize: style.fontSize,
            fontWeight: style.fontWeight,
            lineHeight: style.lineHeight,
            letterSpacing: style.letterSpacing
        };
    }

    function collect() {
        var samples = {};
        Array.prototype.slice.call(document.querySelectorAll('.sample')).forEach(function(element) {
            samples[element.id] = {
                text: element.textContent,
                rect: rectPayload(element.getBoundingClientRect()),
                style: stylePayload(element)
            };
        });
        var result = {
            viewport: {
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                clientWidth: document.documentElement.clientWidth,
                clientHeight: document.documentElement.clientHeight,
                devicePixelRatio: window.devicePixelRatio
            },
            samples: samples
        };
        document.getElementById('metrics').textContent = 'BROWSER_FONT_RASTER_METRICS ' + JSON.stringify(result);
    }

    collect();
    requestAnimationFrame(function() {
        requestAnimationFrame(collect);
    });
</script>
</body>
</html>
