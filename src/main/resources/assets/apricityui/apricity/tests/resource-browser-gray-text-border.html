<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="aui-font-mode" content="web">
    <meta name="aui-viewport" content="mode=browser">
    <title>Resource Browser Gray Text Border</title>
    <style>
        * { box-sizing: border-box; }

        :root {
            --white: #ffffff;
            --gray-light: #e0e0e0;
            --gray: #999999;
            --black: #1a1a1a;
            --bg: #fafafa;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background: var(--bg);
            color: var(--black);
            font-family: "Chakra Petch", sans-serif;
        }

        .surface {
            position: absolute;
            left: 80px;
            top: 80px;
            width: 620px;
            height: 340px;
            background: var(--white);
            border: 2px solid var(--gray-light);
            padding: 32px;
        }

        .one-px-border {
            position: absolute;
            left: 760px;
            top: 80px;
            width: 180px;
            height: 100px;
            background: var(--white);
            border: 1px solid var(--gray-light);
        }

        .content-count {
            font-size: 13px;
            color: var(--gray);
            letter-spacing: 1px;
        }

        .file-meta {
            margin-top: 40px;
            font-size: 10px;
            color: var(--gray);
            text-align: left;
            letter-spacing: 0.5px;
        }

        .detail-empty {
            margin-top: 40px;
            color: var(--gray);
            font-size: 12px;
            text-align: left;
            letter-spacing: 1px;
        }

        .detail-label {
            margin-top: 40px;
            color: var(--gray);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 10px;
        }

        #metrics {
            position: fixed;
            left: -100000px;
            top: 0;
            white-space: pre;
            font: 12px monospace;
            color: transparent;
        }
    </style>
</head>
<body>
<div class="surface" id="surface">
    <div class="content-count" id="contentCount">5 ITEMS</div>
    <div class="file-meta" id="fileMeta">256 KB</div>
    <div class="detail-empty" id="detailEmpty">SELECT FILE TO VIEW DETAILS</div>
    <div class="detail-label" id="detailLabel">TYPE</div>
</div>
<div class="one-px-border" id="onePxBorder"></div>
<pre id="metrics">BROWSER_GRAY_TEXT_BORDER_METRICS pending</pre>
<script>
    function rectPayload(rect) {
        return {
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height,
            right: rect.right,
            bottom: rect.bottom
        };
    }

    function stylePayload(element) {
        var style = getComputedStyle(element);
        return {
            color: style.color,
            backgroundColor: style.backgroundColor,
            fontFamily: style.fontFamily,
            fontSize: style.fontSize,
            letterSpacing: style.letterSpacing,
            borderTopColor: style.borderTopColor,
            borderRightColor: style.borderRightColor,
            borderBottomColor: style.borderBottomColor,
            borderLeftColor: style.borderLeftColor,
            borderTopWidth: style.borderTopWidth,
            borderRightWidth: style.borderRightWidth,
            borderBottomWidth: style.borderBottomWidth,
            borderLeftWidth: style.borderLeftWidth
        };
    }

    function collect() {
        var ids = ['surface', 'onePxBorder', 'contentCount', 'fileMeta', 'detailEmpty', 'detailLabel'];
        var elements = {};
        ids.forEach(function(id) {
            var element = document.getElementById(id);
            elements[id] = {
                text: element.textContent,
                rect: rectPayload(element.getBoundingClientRect()),
                style: stylePayload(element)
            };
        });
        var result = {
            viewport: {
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                clientWidth: document.documentElement.clientWidth,
                clientHeight: document.documentElement.clientHeight
            },
            body: {
                style: stylePayload(document.body)
            },
            elements: elements,
            samples: {
                twoPxBorder: { x: 81, y: 120 },
                onePxBorder: { x: 760, y: 120 },
                surfaceWhite: { x: 120, y: 120 },
                pageBg: { x: 40, y: 40 }
            }
        };
        document.getElementById('metrics').textContent = 'BROWSER_GRAY_TEXT_BORDER_METRICS ' + JSON.stringify(result);
    }

    requestAnimationFrame(function() {
        requestAnimationFrame(collect);
    });
</script>
</body>
</html>
