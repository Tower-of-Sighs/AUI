<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="aui-font-mode" content="web">
    <meta name="aui-viewport" content="mode=browser">
    <title>Resource Browser SVG Stroke Metrics</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 32px;
            background: #fafafa;
            color: #1a1a1a;
            font-family: "Chakra Petch", sans-serif;
        }

        .row {
            display: flex;
            align-items: flex-start;
            gap: 24px;
            margin-bottom: 28px;
        }

        .sample {
            width: 128px;
            min-height: 112px;
            background: #ffffff;
            border: 2px solid #e0e0e0;
            padding: 18px 16px;
            text-align: center;
        }

        .file-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-icon svg {
            width: 40px;
            height: 40px;
        }

        .detail-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #8b5cf6;
        }

        .detail-icon svg {
            width: 56px;
            height: 56px;
        }

        .label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        #metrics {
            position: fixed;
            left: 0;
            top: 0;
            white-space: pre;
            font: 12px monospace;
            color: transparent;
        }
    </style>
</head>
<body>
<div class="row">
    <div class="sample" id="sample-data">
        <div class="file-icon">
            <svg id="svg-data" viewBox="0 0 40 40" fill="none">
                <rect x="6" y="4" width="28" height="32" fill="none" stroke="#1a1a1a" stroke-width="2"/>
                <rect x="10" y="12" width="20" height="2" fill="#8b5cf6"/>
                <rect x="10" y="18" width="16" height="2" fill="#8b5cf6"/>
                <rect x="10" y="24" width="20" height="2" fill="#8b5cf6"/>
                <rect x="10" y="30" width="12" height="2" fill="#8b5cf6"/>
            </svg>
        </div>
        <div class="label">DATA</div>
    </div>
    <div class="sample" id="sample-folder">
        <div class="file-icon">
            <svg id="svg-folder" viewBox="0 0 40 40" fill="none">
                <rect x="4" y="12" width="32" height="22" fill="#8b5cf6"/>
                <rect x="4" y="8" width="14" height="6" fill="#6d28d9"/>
                <rect x="4" y="14" width="32" height="2" fill="#6d28d9"/>
            </svg>
        </div>
        <div class="label">FOLDER</div>
    </div>
    <div class="sample" id="sample-image">
        <div class="file-icon">
            <svg id="svg-image" viewBox="0 0 40 40" fill="none">
                <rect x="6" y="4" width="28" height="32" fill="none" stroke="#1a1a1a" stroke-width="2"/>
                <rect x="10" y="12" width="20" height="14" fill="#8b5cf6" opacity="0.2"/>
                <circle cx="16" cy="18" r="3" fill="#8b5cf6"/>
                <path d="M10 24l6-6 4 4 6-8 4 6v4H10z" fill="#8b5cf6"/>
            </svg>
        </div>
        <div class="label">IMAGE</div>
    </div>
    <div class="sample" id="sample-lock">
        <div class="file-icon">
            <svg id="svg-lock" viewBox="0 0 40 40" fill="none">
                <rect x="10" y="18" width="20" height="16" fill="#8b5cf6"/>
                <path d="M14 18v-5a6 6 0 0 1 12 0v5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
                <circle cx="20" cy="26" r="2" fill="#fff"/>
            </svg>
        </div>
        <div class="label">LOCK</div>
    </div>
</div>

<div class="row">
    <div class="sample" id="sample-detail-data">
        <div class="detail-icon">
            <svg id="svg-detail-data" viewBox="0 0 40 40" fill="none">
                <rect x="6" y="4" width="28" height="32" fill="none" stroke="#1a1a1a" stroke-width="2"/>
                <rect x="10" y="12" width="20" height="2" fill="#8b5cf6"/>
                <rect x="10" y="18" width="16" height="2" fill="#8b5cf6"/>
                <rect x="10" y="24" width="20" height="2" fill="#8b5cf6"/>
                <rect x="10" y="30" width="12" height="2" fill="#8b5cf6"/>
            </svg>
        </div>
        <div class="label">DETAIL DATA</div>
    </div>
    <div class="sample" id="sample-detail-image">
        <div class="detail-icon">
            <svg id="svg-detail-image" viewBox="0 0 40 40" fill="none">
                <rect x="6" y="4" width="28" height="32" fill="none" stroke="#1a1a1a" stroke-width="2"/>
                <rect x="10" y="12" width="20" height="14" fill="#8b5cf6" opacity="0.2"/>
                <circle cx="16" cy="18" r="3" fill="#8b5cf6"/>
                <path d="M10 24l6-6 4 4 6-8 4 6v4H10z" fill="#8b5cf6"/>
            </svg>
        </div>
        <div class="label">DETAIL IMAGE</div>
    </div>
</div>

<pre id="metrics">BROWSER_SVG_STROKE_METRICS pending</pre>
<script>
    function rectOf(node) {
        if (!node) return null;
        var rect = node.getBoundingClientRect();
        return {
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height,
            right: rect.right,
            bottom: rect.bottom
        };
    }

    function collect() {
        var result = {
            viewport: {
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                clientWidth: document.documentElement.clientWidth,
                clientHeight: document.documentElement.clientHeight
            },
            samples: []
        };
        Array.prototype.slice.call(document.querySelectorAll('.sample')).forEach(function(sample, index) {
            var icon = sample.querySelector('.file-icon, .detail-icon');
            var svg = sample.querySelector('svg');
            result.samples.push({
                index: index,
                id: sample.id,
                sample: rectOf(sample),
                icon: rectOf(icon),
                svg: rectOf(svg),
                svgId: svg ? svg.id : null
            });
        });
        document.getElementById('metrics').textContent = 'BROWSER_SVG_STROKE_METRICS ' + JSON.stringify(result);
    }

    requestAnimationFrame(function() {
        requestAnimationFrame(collect);
    });
</script>
</body>
</html>
