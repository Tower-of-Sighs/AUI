<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="aui-viewport" content="mode=browser">
    <title>Transition Percent Height</title>
    <style>
        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #fafafa;
        }

        #host {
            position: relative;
            width: 120px;
            height: 200px;
            margin: 40px;
            background: #ffffff;
        }

        #host::before,
        #rail {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 2px;
            height: 0;
            background: #8b5cf6;
            transition: height 1000ms linear;
        }

        #rail {
            left: 8px;
            background: #22c55e;
        }

        #host.active::before,
        #host.active #rail {
            height: 100%;
        }

        #metrics {
            position: fixed;
            left: -100000px;
            top: 0;
            white-space: pre;
            font: 12px monospace;
            color: transparent;
        }
    </style>
</head>
<body>
<div id="host"><div id="rail"></div></div>
<pre id="metrics">BROWSER_TRANSITION_PERCENT_HEIGHT_METRICS pending</pre>
<script>
    function rectPayload(rect) {
        return {
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height,
            right: rect.right,
            bottom: rect.bottom
        };
    }

    function stylePayload(style) {
        return {
            position: style.position,
            top: style.top,
            left: style.left,
            width: style.width,
            height: style.height,
            transitionProperty: style.transitionProperty,
            transitionDuration: style.transitionDuration,
            transitionTimingFunction: style.transitionTimingFunction,
            backgroundColor: style.backgroundColor
        };
    }

    function snapshot(label) {
        var host = document.getElementById("host");
        var rail = document.getElementById("rail");
        return {
            label: label,
            host: rectPayload(host.getBoundingClientRect()),
            rail: rectPayload(rail.getBoundingClientRect()),
            hostBefore: stylePayload(getComputedStyle(host, "::before")),
            railStyle: stylePayload(getComputedStyle(rail))
        };
    }

    var samples = [];
    requestAnimationFrame(function() {
        samples.push(snapshot("initial"));
        document.getElementById("host").classList.add("active");
        setTimeout(function() {
            samples.push(snapshot("mid"));
        }, 500);
        setTimeout(function() {
            samples.push(snapshot("final"));
            document.getElementById("metrics").textContent =
                "BROWSER_TRANSITION_PERCENT_HEIGHT_METRICS " + JSON.stringify({
                    viewport: {
                        innerWidth: window.innerWidth,
                        innerHeight: window.innerHeight,
                        clientWidth: document.documentElement.clientWidth,
                        clientHeight: document.documentElement.clientHeight
                    },
                    samples: samples
                });
        }, 1300);
    });
</script>
</body>
</html>
