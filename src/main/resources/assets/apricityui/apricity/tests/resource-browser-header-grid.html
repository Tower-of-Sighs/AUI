<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="aui-font-mode" content="web">
    <meta name="aui-viewport" content="mode=browser">
    <title>Resource Browser Header Grid</title>
    <style>
        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #fafafa;
        }

        .header {
            height: 60px;
            background: #ffffff;
            border-bottom: 3px solid #8b5cf6;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(139,92,246,0.03) 20px, rgba(139,92,246,0.03) 21px);
            pointer-events: none;
        }

        .header::after {
            content: "";
            position: absolute;
            left: 650px;
            top: 0;
            width: 120px;
            height: 100%;
            background: #ffffff;
        }

        #metrics {
            position: fixed;
            left: -100000px;
            top: 0;
            white-space: pre;
            font: 12px monospace;
            color: transparent;
        }
    </style>
</head>
<body>
<div class="header" id="header"></div>
<pre id="metrics">BROWSER_HEADER_GRID_METRICS pending</pre>
<script>
    function collect() {
        var header = document.getElementById('header');
        var rect = header.getBoundingClientRect();
        var style = getComputedStyle(header, '::before');
        var result = {
            viewport: {
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                clientWidth: document.documentElement.clientWidth,
                clientHeight: document.documentElement.clientHeight
            },
            header: {
                x: rect.x,
                y: rect.y,
                width: rect.width,
                height: rect.height,
                right: rect.right,
                bottom: rect.bottom
            },
            before: {
                backgroundImage: style.backgroundImage,
                width: style.width,
                height: style.height,
                opacity: style.opacity
            }
        };
        document.getElementById('metrics').textContent = 'BROWSER_HEADER_GRID_METRICS ' + JSON.stringify(result);
    }

    requestAnimationFrame(function() {
        requestAnimationFrame(collect);
    });
</script>
</body>
</html>
