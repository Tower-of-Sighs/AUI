<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="aui-viewport" content="mode=browser">
    <title>Absolute Pseudo Percent Width</title>
    <style>
        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #fafafa;
        }

        .case {
            position: relative;
            margin: 40px;
            width: max-content;
        }

        .action-btn {
            padding: 8px 16px;
            background: #ffffff;
            border: 2px solid #1a1a1a;
            color: #1a1a1a;
            font: 600 13px/1 "Arial", sans-serif;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #8b5cf6;
        }

        .action-btn.hover::before {
            left: 0;
        }

        .fixed {
            width: 88.5px;
            height: 37px;
        }

        #metrics {
            position: fixed;
            left: -100000px;
            top: 0;
            white-space: pre;
            font: 12px monospace;
            color: transparent;
        }
    </style>
</head>
<body>
<div class="case">
    <button id="intrinsic" class="action-btn hover">BACK</button>
</div>
<div class="case">
    <button id="fixed" class="action-btn fixed hover">BACK</button>
</div>
<pre id="metrics">BROWSER_ABSOLUTE_PSEUDO_PERCENT_WIDTH_METRICS pending</pre>
<script>
    function rectPayload(rect) {
        return {
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height,
            right: rect.right,
            bottom: rect.bottom
        };
    }

    function stylePayload(style) {
        return {
            display: style.display,
            position: style.position,
            boxSizing: style.boxSizing,
            paddingTop: style.paddingTop,
            paddingRight: style.paddingRight,
            paddingBottom: style.paddingBottom,
            paddingLeft: style.paddingLeft,
            borderTopWidth: style.borderTopWidth,
            borderRightWidth: style.borderRightWidth,
            borderBottomWidth: style.borderBottomWidth,
            borderLeftWidth: style.borderLeftWidth,
            left: style.left,
            top: style.top,
            width: style.width,
            height: style.height,
            backgroundColor: style.backgroundColor,
            color: style.color
        };
    }

    function sample(id) {
        var host = document.getElementById(id);
        var rect = host.getBoundingClientRect();
        var style = getComputedStyle(host);
        var before = getComputedStyle(host, "::before");
        var borderX = parseFloat(style.borderLeftWidth) + parseFloat(style.borderRightWidth);
        var borderY = parseFloat(style.borderTopWidth) + parseFloat(style.borderBottomWidth);
        var paddingX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
        var paddingY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
        return {
            id: id,
            hostRect: rectPayload(rect),
            hostStyle: stylePayload(style),
            beforeStyle: stylePayload(before),
            derived: {
                borderBoxWidth: rect.width,
                paddingBoxWidth: rect.width - borderX,
                contentBoxWidth: rect.width - borderX - paddingX,
                borderBoxHeight: rect.height,
                paddingBoxHeight: rect.height - borderY,
                contentBoxHeight: rect.height - borderY - paddingY
            }
        };
    }

    function collect() {
        var payload = {
            viewport: {
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                clientWidth: document.documentElement.clientWidth,
                clientHeight: document.documentElement.clientHeight
            },
            samples: [sample("intrinsic"), sample("fixed")]
        };
        document.getElementById("metrics").textContent =
            "BROWSER_ABSOLUTE_PSEUDO_PERCENT_WIDTH_METRICS " + JSON.stringify(payload);
    }

    collect();
    requestAnimationFrame(collect);
    setTimeout(collect, 50);
</script>
</body>
</html>
