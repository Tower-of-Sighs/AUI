<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resource Browser Browser Metrics</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff;
        }

        #target {
            width: 100vw;
            height: 100vh;
            border: 0;
            display: block;
        }

        #metrics {
            position: fixed;
            left: 0;
            top: 0;
            white-space: pre;
            font: 12px monospace;
            color: transparent;
        }
    </style>
</head>
<body>
<iframe id="target" src="../devtools/resource.html"></iframe>
<pre id="metrics">BROWSER_RESOURCE_METRICS pending</pre>
<script>
    function rectPayload(doc, selector, label) {
        var node = doc.querySelector(selector);
        if (!node) return [label, null];
        var rect = node.getBoundingClientRect();
        return [label, {
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height,
            right: rect.right,
            bottom: rect.bottom
        }];
    }

    function firstNormalCard(doc) {
        var cards = Array.prototype.slice.call(doc.querySelectorAll('.file-card'));
        for (var i = 0; i < cards.length; i++) {
            if (!cards[i].classList.contains('selected')) return cards[i];
        }
        return null;
    }

    function rectOf(node) {
        if (!node) return null;
        var rect = node.getBoundingClientRect();
        return {
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height,
            right: rect.right,
            bottom: rect.bottom
        };
    }

    function scrollPayload(doc, selector, label, childSelector) {
        var node = doc.querySelector(selector);
        if (!node) return [label, null];
        var style = doc.defaultView.getComputedStyle(node);
        var child = childSelector ? node.querySelector(childSelector) : null;
        return [label, {
            selector: selector,
            scrollTop: node.scrollTop,
            scrollLeft: node.scrollLeft,
            scrollWidth: node.scrollWidth,
            scrollHeight: node.scrollHeight,
            clientWidth: node.clientWidth,
            clientHeight: node.clientHeight,
            offsetWidth: node.offsetWidth,
            offsetHeight: node.offsetHeight,
            canScrollY: node.scrollHeight > node.clientHeight,
            canScrollX: node.scrollWidth > node.clientWidth,
            overflow: style.overflow,
            overflowX: style.overflowX,
            overflowY: style.overflowY,
            rect: rectOf(node),
            childSelector: childSelector || null,
            childRect: rectOf(child)
        }];
    }

    function selectedCardStyle(win, node, pseudo) {
        if (!node) return null;
        var style = win.getComputedStyle(node, pseudo || null);
        return {
            backgroundColor: style.backgroundColor,
            borderTopColor: style.borderTopColor,
            borderRightColor: style.borderRightColor,
            borderBottomColor: style.borderBottomColor,
            borderLeftColor: style.borderLeftColor,
            borderTopWidth: style.borderTopWidth,
            borderRightWidth: style.borderRightWidth,
            borderBottomWidth: style.borderBottomWidth,
            borderLeftWidth: style.borderLeftWidth,
            content: style.content,
            position: style.position,
            top: style.top,
            right: style.right,
            bottom: style.bottom,
            left: style.left,
            width: style.width,
            height: style.height,
            transform: style.transform,
            transformOrigin: style.transformOrigin,
            background: style.background,
            clipPath: style.clipPath
        };
    }

    function detailStyle(win, node, pseudo) {
        if (!node) return null;
        var style = win.getComputedStyle(node, pseudo || null);
        return {
            display: style.display,
            position: style.position,
            boxSizing: style.boxSizing,
            width: style.width,
            height: style.height,
            marginTop: style.marginTop,
            marginRight: style.marginRight,
            marginBottom: style.marginBottom,
            marginLeft: style.marginLeft,
            paddingTop: style.paddingTop,
            paddingRight: style.paddingRight,
            paddingBottom: style.paddingBottom,
            paddingLeft: style.paddingLeft,
            backgroundColor: style.backgroundColor,
            color: style.color,
            borderTopColor: style.borderTopColor,
            borderRightColor: style.borderRightColor,
            borderBottomColor: style.borderBottomColor,
            borderLeftColor: style.borderLeftColor,
            borderTopWidth: style.borderTopWidth,
            borderRightWidth: style.borderRightWidth,
            borderBottomWidth: style.borderBottomWidth,
            borderLeftWidth: style.borderLeftWidth,
            fontFamily: style.fontFamily,
            fontSize: style.fontSize,
            fontWeight: style.fontWeight,
            lineHeight: style.lineHeight,
            letterSpacing: style.letterSpacing,
            textAlign: style.textAlign,
            content: style.content,
            top: style.top,
            right: style.right,
            bottom: style.bottom,
            left: style.left,
            transform: style.transform,
            transformOrigin: style.transformOrigin,
            animationName: style.animationName,
            animationDuration: style.animationDuration,
            animationDelay: style.animationDelay,
            clipPath: style.clipPath
        };
    }

    function detailRectWithText(panel, selector, label) {
        var node = panel ? panel.querySelector(selector) : null;
        var rect = rectOf(node);
        if (rect) {
            rect.label = label;
            rect.text = node.textContent;
            rect.className = node.className;
            var panelRect = panel.getBoundingClientRect();
            rect.relativeX = rect.x - panelRect.x;
            rect.relativeY = rect.y - panelRect.y;
        }
        return rect;
    }

    function normalCards(doc) {
        return Array.prototype.slice.call(doc.querySelectorAll('.file-card')).filter(function(card) {
            return !card.classList.contains('selected');
        });
    }

    function collectMetrics() {
        var frame = document.getElementById('target');
        var doc = frame.contentDocument;
        var result = {
            viewport: {
                outerInnerWidth: window.innerWidth,
                outerInnerHeight: window.innerHeight,
                outerClientWidth: document.documentElement.clientWidth,
                outerClientHeight: document.documentElement.clientHeight,
                frameWidth: frame.getBoundingClientRect().width,
                frameHeight: frame.getBoundingClientRect().height,
                innerWidth: frame.contentWindow.innerWidth,
                innerHeight: frame.contentWindow.innerHeight,
                innerClientWidth: doc.documentElement.clientWidth,
                innerClientHeight: doc.documentElement.clientHeight,
                bodyClientWidth: doc.body ? doc.body.clientWidth : null,
                bodyClientHeight: doc.body ? doc.body.clientHeight : null
            },
            state: {},
            rects: {}
        };

        var contentCount = doc.querySelector('#contentCount');
        var selectedCard = doc.querySelector('.file-card.selected');
        var detailPanel = doc.querySelector('.detail-panel.active');
        var addedFile = doc.querySelector('[data-name="AUTO_PROMPT_FILE"]');
        var cards = doc.querySelectorAll('.file-card');

        result.state.contentCount = contentCount ? contentCount.textContent : null;
        result.state.fileCards = cards.length;
        result.state.selected = selectedCard ? selectedCard.getAttribute('data-name') : null;
        result.state.detailActive = !!detailPanel;
        result.state.addedFile = !!addedFile;

        [
            rectPayload(doc, 'html', 'html'),
            rectPayload(doc, 'body', 'body'),
            rectPayload(doc, '.header', 'header'),
            rectPayload(doc, '.main', 'main'),
            rectPayload(doc, '.sidebar', 'sidebar'),
            rectPayload(doc, '.detail-panel', 'detailPanel'),
            rectPayload(doc, '.content', 'content'),
            rectPayload(doc, '.content-header', 'contentHeader'),
            rectPayload(doc, '.content-title', 'contentTitle'),
            rectPayload(doc, '#contentCount', 'contentCount'),
            rectPayload(doc, '.detail-empty', 'detailEmpty'),
            rectPayload(doc, '#fileGrid', 'fileGrid'),
            rectPayload(doc, '.header-actions', 'headerActions'),
            rectPayload(doc, '.logo', 'logo'),
            rectPayload(doc, '.logo-block', 'logoBlock'),
            rectPayload(doc, '.nav-path', 'navPath'),
            rectPayload(doc, '.sidebar-title', 'sidebarTitle'),
            rectPayload(doc, '.tree-item', 'firstTreeItem')
        ].forEach(function(entry) {
            result.rects[entry[0]] = entry[1];
        });

        result.rects.logoChildren = Array.prototype.slice.call(doc.querySelectorAll('.logo > *')).map(function(node, index) {
            var rect = rectOf(node);
            if (rect) {
                rect.index = index;
                rect.text = node.textContent;
            }
            return rect;
        });
        result.rects.navPathChildren = Array.prototype.slice.call(doc.querySelectorAll('.nav-path > *')).map(function(node, index) {
            var rect = rectOf(node);
            if (rect) {
                rect.index = index;
                rect.className = node.className;
                rect.text = node.textContent;
            }
            return rect;
        });
        result.rects.headerActionButtons = Array.prototype.slice.call(doc.querySelectorAll('.header-actions > *')).map(function(node, index) {
            var rect = rectOf(node);
            if (rect) {
                rect.index = index;
                rect.text = node.textContent;
            }
            return rect;
        });
        result.rects.treeItems = Array.prototype.slice.call(doc.querySelectorAll('.tree-item')).slice(0, 12).map(function(node, index) {
            var rect = rectOf(node);
            if (rect) {
                rect.index = index;
                rect.className = node.className;
                rect.text = node.textContent;
                rect.children = {};
                [
                    ['toggle', '.tree-toggle'],
                    ['icon', '.tree-icon'],
                    ['label', 'span:last-child']
                ].forEach(function(entry) {
                    var childRect = rectOf(node.querySelector(entry[1]));
                    if (childRect) {
                        childRect.relativeX = childRect.x - rect.x;
                        childRect.relativeY = childRect.y - rect.y;
                    }
                    rect.children[entry[0]] = childRect;
                });
            }
            return rect;
        });

        var firstCard = firstNormalCard(doc);
        result.rects.firstNormalFileCard = rectOf(firstCard);
        result.rects.selectedFileCard = rectOf(selectedCard);

        var normalCardRects = normalCards(doc).map(function(card, index) {
            var rect = rectOf(card);
            rect.index = index;
            rect.name = card.getAttribute('data-name');
            rect.children = {};
            [
                ['icon', '.file-icon'],
                ['fileName', '.file-name'],
                ['fileMeta', '.file-meta']
            ].forEach(function(entry) {
                var childRect = rectOf(card.querySelector(entry[1]));
                if (childRect) {
                    childRect.relativeX = childRect.x - rect.x;
                    childRect.relativeY = childRect.y - rect.y;
                }
                rect.children[entry[0]] = childRect;
            });
            return rect;
        });

        result.scroll = {};
        [
            scrollPayload(doc, '.sidebar', 'sidebar', '.tree-item'),
            scrollPayload(doc, '.content', 'content', '.file-card'),
            scrollPayload(doc, '.detail-panel', 'detailPanel', '#detailContent')
        ].forEach(function(entry) {
            result.scroll[entry[0]] = entry[1];
        });
        result.rects.normalFileCards = normalCardRects;
        result.rects.fileGridColumnGaps = [];
        for (var i = 1; i < normalCardRects.length; i++) {
            var prev = normalCardRects[i - 1];
            var current = normalCardRects[i];
            if (Math.abs(current.y - prev.y) < 1) {
                result.rects.fileGridColumnGaps.push({
                    from: prev.index,
                    to: current.index,
                    gap: current.x - prev.right
                });
            }
        }

        var panel = doc.querySelector('.detail-panel');
        result.rects.detailActive = {};
        [
            ['detailContent', '#detailContent'],
            ['detailContentInner', '.detail-content'],
            ['detailIcon', '.detail-icon'],
            ['detailIconSvg', '.detail-icon svg'],
            ['detailName', '.detail-name'],
            ['detailTags', '.detail-tags'],
            ['detailTagsTitle', '.detail-tags-title']
        ].forEach(function(entry) {
            result.rects.detailActive[entry[0]] = detailRectWithText(panel, entry[1], entry[0]);
        });
        result.rects.detailActive.rows = Array.prototype.slice.call(doc.querySelectorAll('.detail-row')).map(function(node, index) {
            var rect = rectOf(node);
            if (rect) {
                var panelRect = panel.getBoundingClientRect();
                rect.index = index;
                rect.text = node.textContent;
                rect.relativeX = rect.x - panelRect.x;
                rect.relativeY = rect.y - panelRect.y;
                rect.label = detailRectWithText(node, '.detail-label', 'label');
                rect.value = detailRectWithText(node, '.detail-value', 'value');
            }
            return rect;
        });
        result.rects.detailActive.tags = Array.prototype.slice.call(doc.querySelectorAll('.tag')).map(function(node, index) {
            var rect = rectOf(node);
            if (rect) {
                var panelRect = panel.getBoundingClientRect();
                rect.index = index;
                rect.text = node.textContent;
                rect.relativeX = rect.x - panelRect.x;
                rect.relativeY = rect.y - panelRect.y;
            }
            return rect;
        });

        result.computed = {};
        [
            ['contentTitle', doc.querySelector('.content-title')],
            ['contentCount', contentCount],
            ['detailEmpty', doc.querySelector('.detail-empty')],
            ['firstNormalFileCard', firstCard]
        ].forEach(function(entry) {
            if (!entry[1]) return;
            var style = frame.contentWindow.getComputedStyle(entry[1]);
            result.computed[entry[0]] = {
                fontFamily: style.fontFamily,
                fontSize: style.fontSize,
                lineHeight: style.lineHeight,
                transform: style.transform,
                animationName: style.animationName,
                animationDuration: style.animationDuration,
                animationDelay: style.animationDelay
            };
        });
        result.computed.selectedFileCard = selectedCardStyle(frame.contentWindow, selectedCard);
        result.computed.selectedFileCardBefore = selectedCardStyle(frame.contentWindow, selectedCard, '::before');
        result.computed.selectedFileCardAfter = selectedCardStyle(frame.contentWindow, selectedCard, '::after');
        result.computed.detailActive = {};
        [
            ['detailPanel', doc.querySelector('.detail-panel')],
            ['detailContent', doc.querySelector('.detail-content')],
            ['detailIcon', doc.querySelector('.detail-icon')],
            ['detailIconSvg', doc.querySelector('.detail-icon svg')],
            ['detailName', doc.querySelector('.detail-name')],
            ['firstDetailRow', doc.querySelector('.detail-row')],
            ['firstDetailLabel', doc.querySelector('.detail-label')],
            ['firstDetailValue', doc.querySelector('.detail-value')],
            ['detailTags', doc.querySelector('.detail-tags')],
            ['detailTagsTitle', doc.querySelector('.detail-tags-title')],
            ['firstTag', doc.querySelector('.tag')]
        ].forEach(function(entry) {
            result.computed.detailActive[entry[0]] = detailStyle(frame.contentWindow, entry[1]);
        });
        result.computed.detailActive.detailPanelBefore = detailStyle(frame.contentWindow, doc.querySelector('.detail-panel'), '::before');
        result.computed.detailActive.detailIconBefore = detailStyle(frame.contentWindow, doc.querySelector('.detail-icon'), '::before');
        result.computed.detailActive.detailNameAfter = detailStyle(frame.contentWindow, doc.querySelector('.detail-name'), '::after');

        document.getElementById('metrics').textContent = 'BROWSER_RESOURCE_METRICS ' + JSON.stringify(result);
    }

    document.getElementById('target').addEventListener('load', function() {
        var frame = document.getElementById('target');
        var doc = frame.contentDocument;
        var params = new URLSearchParams(window.location.search);
        if (params.get('static') === '1') {
            var style = doc.createElement('style');
            style.textContent = '*,*::before,*::after{animation:none!important;transition:none!important;}';
            doc.head.appendChild(style);
        }
        if (params.get('interaction') === 'resource-browser') {
            frame.contentWindow.selectFile('level.dat');
        }
        if (params.get('interaction') === 'resource-browser-new-file') {
            var promptResponse = params.get('promptResponse') || 'AUTO_PROMPT_FILE';
            frame.contentWindow.prompt = function() { return promptResponse; };
            frame.contentWindow.createNew();
        }
        if (params.get('interaction') === 'resource-browser-scroll') {
            frame.contentWindow.selectFile('level.dat');
            setTimeout(function() {
                [
                    doc.querySelector('.sidebar'),
                    doc.querySelector('.content'),
                    doc.querySelector('.detail-panel')
                ].forEach(function(node) {
                    if (node) {
                        node.scrollTop = 120;
                        node.scrollLeft = 30;
                    }
                });
            }, 300);
        }
        setTimeout(collectMetrics, 1200);
    });
</script>
</body>
</html>
