<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="aui-font-mode" content="web">
    <meta name="aui-viewport" content="mode=browser">
    <title>Resource Browser Layer Colors</title>
    <style>
        * { box-sizing: border-box; }

        :root {
            --white: #ffffff;
            --gray-light: #e0e0e0;
            --purple: #8b5cf6;
            --bg: #fafafa;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background: var(--bg);
        }

        .header {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 60px;
            background: var(--white);
            border-bottom: 3px solid var(--purple);
        }

        .sidebar {
            position: absolute;
            left: 0;
            top: 80px;
            width: 280px;
            height: 220px;
            background: var(--white);
            border-right: 2px solid var(--gray-light);
        }

        .content {
            position: absolute;
            left: 312px;
            top: 80px;
            width: 320px;
            height: 220px;
        }

        .card {
            position: absolute;
            left: 0;
            top: 48px;
            width: 160px;
            height: 120px;
            background: var(--white);
            border: 2px solid var(--gray-light);
        }

        .detail {
            position: absolute;
            left: 680px;
            top: 80px;
            width: 300px;
            height: 220px;
            background: var(--white);
            border-left: 2px solid var(--gray-light);
        }

        .overlay-white {
            position: absolute;
            width: 120px;
            height: 60px;
            background: rgba(139,92,246,0.05);
        }

        .overlay-bg {
            position: absolute;
            width: 120px;
            height: 60px;
            background: rgba(139,92,246,0.05);
        }

        .overlay-white {
            left: 20px;
            top: 40px;
        }

        .overlay-bg {
            left: 1010px;
            top: 120px;
        }

        #metrics {
            position: fixed;
            left: -100000px;
            top: 0;
            white-space: pre;
            font: 12px monospace;
            color: transparent;
        }
    </style>
</head>
<body>
<div class="header" id="header"></div>
<div class="sidebar" id="sidebar"></div>
<div class="content" id="content">
    <div class="card" id="card"></div>
</div>
<div class="detail" id="detail">
    <div class="overlay-white" id="overlayWhite"></div>
</div>
<div class="overlay-bg" id="overlayBg"></div>
<pre id="metrics">BROWSER_LAYER_COLORS_METRICS pending</pre>
<script>
    function rectPayload(rect) {
        return {
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height,
            right: rect.right,
            bottom: rect.bottom
        };
    }

    function stylePayload(element) {
        var style = getComputedStyle(element);
        return {
            backgroundColor: style.backgroundColor,
            borderTopColor: style.borderTopColor,
            borderRightColor: style.borderRightColor,
            borderBottomColor: style.borderBottomColor,
            borderLeftColor: style.borderLeftColor,
            borderTopWidth: style.borderTopWidth,
            borderRightWidth: style.borderRightWidth,
            borderBottomWidth: style.borderBottomWidth,
            borderLeftWidth: style.borderLeftWidth
        };
    }

    function collect() {
        var ids = ['header', 'sidebar', 'content', 'card', 'detail', 'overlayWhite', 'overlayBg'];
        var elements = {};
        ids.forEach(function(id) {
            var element = document.getElementById(id);
            elements[id] = {
                rect: rectPayload(element.getBoundingClientRect()),
                style: stylePayload(element)
            };
        });
        var bodyStyle = getComputedStyle(document.body);
        var result = {
            viewport: {
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                clientWidth: document.documentElement.clientWidth,
                clientHeight: document.documentElement.clientHeight
            },
            body: {
                backgroundColor: bodyStyle.backgroundColor
            },
            elements: elements,
            samples: {
                pageBg: { x: 1000, y: 90 },
                headerWhite: { x: 100, y: 30 },
                sidebarWhite: { x: 40, y: 120 },
                sidebarBorder: { x: 279, y: 120 },
                contentBg: { x: 640, y: 120 },
                cardWhite: { x: 340, y: 150 },
                cardBorder: { x: 313, y: 130 },
                detailWhite: { x: 730, y: 230 },
                detailBorder: { x: 681, y: 120 },
                overlayWhite: { x: 760, y: 150 },
                overlayBg: { x: 1070, y: 150 }
            }
        };
        document.getElementById('metrics').textContent = 'BROWSER_LAYER_COLORS_METRICS ' + JSON.stringify(result);
    }

    requestAnimationFrame(function() {
        requestAnimationFrame(collect);
    });
</script>
</body>
</html>
