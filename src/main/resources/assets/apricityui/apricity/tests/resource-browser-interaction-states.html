<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="aui-font-mode" content="web">
    <meta name="aui-viewport" content="mode=browser">
    <title>AUI Resource Browser Interaction States</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --purple: #8b5cf6;
            --purple-dark: #6d28d9;
            --purple-light: #a78bfa;
            --white: #ffffff;
            --gray-light: #e0e0e0;
            --gray: #999999;
            --black: #1a1a1a;
            --bg: #fafafa;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--black);
            font-family: "Chakra Petch", sans-serif;
            font-size: 14px;
        }

        .page {
            height: 100vh;
            display: grid;
            grid-template-rows: 60px 1fr;
        }

        .header {
            height: 60px;
            background: var(--white);
            border-bottom: 3px solid var(--purple);
            display: flex;
            align-items: center;
            padding: 0 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .logo-block {
            width: 32px;
            height: 32px;
            background: var(--purple);
        }

        .actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            position: relative;
            overflow: hidden;
            padding: 8px 16px;
            border: 2px solid var(--black);
            background: var(--white);
            color: var(--black);
            font-family: "Chakra Petch", sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .action-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--purple);
            transition: left 0.25s ease;
            z-index: -1;
        }

        .action-btn:hover::before { left: 0; }

        .action-btn:hover {
            border-color: var(--purple);
            color: var(--white);
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 var(--black);
        }

        .action-btn:active {
            transform: translate(0, 0);
            box-shadow: 0 0 0 var(--black);
        }

        .workspace {
            display: flex;
            min-height: 0;
        }

        .sidebar,
        .detail-panel {
            background: var(--white);
            min-height: 0;
        }

        .sidebar {
            width: 280px;
            flex: 0 0 280px;
            border-right: 2px solid var(--gray-light);
        }

        .sidebar-title {
            padding: 20px 24px 12px;
            border-bottom: 1px solid var(--gray-light);
            color: var(--purple);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
        }

        .tree-item {
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid transparent;
            font-size: 13px;
            transition: background 0.15s, border-color 0.15s, padding-left 0.15s;
        }

        .tree-item:hover {
            background: rgba(139,92,246,0.05);
            border-left-color: var(--purple-light);
            padding-left: 28px;
        }

        .tree-item.selected {
            background: rgba(139,92,246,0.1);
            border-left-color: var(--purple);
            font-weight: 600;
        }

        .tree-icon {
            width: 16px;
            height: 16px;
            background: var(--purple);
            transition: transform 0.2s ease;
        }

        .tree-item:hover .tree-icon { transform: scale(1.2); }

        .content {
            width: 640px;
            flex: 0 0 640px;
            padding: 32px;
            min-width: 0;
            min-height: 0;
        }

        .content-header {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--black);
        }

        .content-header::after {
            content: "";
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--purple);
        }

        .content-title {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        .file-card {
            position: relative;
            overflow: hidden;
            min-height: 132px;
            padding: 20px 16px;
            border: 2px solid var(--gray-light);
            background: var(--white);
            transition: all 0.2s ease;
        }

        .file-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--purple);
            transform: scaleY(0);
            transform-origin: center;
            transition: transform 0.25s ease;
        }

        .file-card::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            background: var(--purple);
            transition: all 0.2s ease;
        }

        .file-card:hover {
            border-color: var(--purple);
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0 var(--black);
        }

        .file-card:hover::before,
        .file-card.selected::before {
            transform: scaleY(1);
        }

        .file-card:hover::after,
        .file-card.selected::after {
            width: 12px;
            height: 12px;
            clip-path: polygon(100% 0, 0 0, 100% 100%);
        }

        .file-card.selected {
            border-color: var(--purple);
            background: rgba(139,92,246,0.05);
        }

        .file-card:active {
            transform: translate(0, 0);
            box-shadow: 0 0 0 var(--black);
        }

        .file-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            border: 3px solid var(--purple);
        }

        .file-name {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: 0.5px;
            transition: color 0.2s ease;
        }

        .file-card:hover .file-name { color: var(--purple); }

        .file-meta {
            margin-top: 6px;
            color: var(--gray);
            text-align: center;
            font-size: 10px;
            letter-spacing: 0.5px;
        }

        .detail-panel {
            position: relative;
            width: 300px;
            flex: 0 0 300px;
            border-left: 2px solid var(--gray-light);
            padding: 24px;
        }

        .detail-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 0;
            background: var(--purple);
            transition: height 0.4s ease;
        }

        .detail-panel.active::before { height: 100%; }

        .detail-name {
            margin-bottom: 24px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--gray-light);
            font-size: 12px;
        }

        .detail-label {
            color: var(--gray);
            font-size: 10px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
<div class="page">
    <header class="header">
        <div class="logo"><div class="logo-block"></div><span>MINE//EXPLORER</span></div>
        <div class="actions">
            <button id="hoverButton" class="action-btn">HOVER</button>
            <button id="activeButton" class="action-btn">ACTIVE</button>
        </div>
    </header>

    <main class="workspace">
        <aside class="sidebar">
            <div class="sidebar-title">DIRECTORIES</div>
            <div id="hoverTree" class="tree-item"><span>▾</span><span class="tree-icon"></span><span>HOVER TREE</span></div>
            <div class="tree-item selected"><span>▾</span><span class="tree-icon"></span><span>SELECTED TREE</span></div>
        </aside>

        <section class="content">
            <div class="content-header">
                <div class="content-title">INTERACTION STATES</div>
                <div>FORCED</div>
            </div>
            <div class="file-grid">
                <div id="hoverFile" class="file-card">
                    <div class="file-icon"></div>
                    <div class="file-name">HOVER_FILE.PNG</div>
                    <div class="file-meta">hover</div>
                </div>
                <div class="file-card selected">
                    <div class="file-icon"></div>
                    <div class="file-name">SELECTED_FILE.JSON</div>
                    <div class="file-meta">selected</div>
                </div>
                <div id="activeFile" class="file-card">
                    <div class="file-icon"></div>
                    <div class="file-name">ACTIVE_FILE.TXT</div>
                    <div class="file-meta">active</div>
                </div>
            </div>
        </section>

        <aside class="detail-panel active">
            <div class="detail-name">DETAIL ACTIVE</div>
            <div class="detail-row"><span class="detail-label">TYPE</span><span>FILE</span></div>
            <div class="detail-row"><span class="detail-label">STATE</span><span>ACTIVE</span></div>
            <div class="detail-row"><span class="detail-label">PATH</span><span>/tests/state</span></div>
        </aside>
    </main>
</div>

<script>
    document.getElementById('hoverButton').setHover(true);
    document.getElementById('activeButton').setHover(true);
    document.getElementById('activeButton').setActive(true);
    document.getElementById('hoverTree').setHover(true);
    document.getElementById('hoverFile').setHover(true);
    document.getElementById('activeFile').setHover(true);
    document.getElementById('activeFile').setActive(true);
</script>
</body>
</html>
