<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="aui-font-mode" content="web">
    <meta name="aui-viewport" content="mode=browser">
    <title>Resource Browser Font Raster</title>
    <style>
        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #fafafa;
            color: #999999;
            font-family: Arial, sans-serif;
        }

        .surface {
            position: absolute;
            left: 80px;
            top: 80px;
            width: 760px;
            height: 620px;
            padding: 32px;
            background: #ffffff;
            border: 2px solid #e0e0e0;
        }

        .sample {
            display: block;
            width: 620px;
            height: 28px;
            margin-bottom: 18px;
            color: #999999;
            background: #ffffff;
            white-space: nowrap;
        }

        .on-fafafa {
            background: #fafafa;
        }

        #arial13 { font-family: Arial, sans-serif; font-size: 13px; letter-spacing: 1px; }
        #arial13Plain { font-family: Arial, sans-serif; font-size: 13px; letter-spacing: normal; }
        #sans13 { font-family: sans-serif; font-size: 13px; letter-spacing: 1px; }
        #chakra13 { font-family: "Chakra Petch", sans-serif; font-size: 13px; letter-spacing: 1px; }
        #arial10 { font-family: Arial, sans-serif; font-size: 10px; letter-spacing: 0.5px; }
        #arial12 { font-family: Arial, sans-serif; font-size: 12px; letter-spacing: 1px; }
        #chakra12 { font-family: "Chakra Petch", sans-serif; font-size: 12px; letter-spacing: 1px; }
        #arial13White { font-family: Arial, sans-serif; font-size: 13px; letter-spacing: 1px; }
        #arial13Fafafa { font-family: Arial, sans-serif; font-size: 13px; letter-spacing: 1px; }
        #arial12White { font-family: Arial, sans-serif; font-size: 12px; letter-spacing: 1px; }
        #arial12Fafafa { font-family: Arial, sans-serif; font-size: 12px; letter-spacing: 1px; }
        #chakra12White { font-family: "Chakra Petch", sans-serif; font-size: 12px; letter-spacing: 1px; }
        #chakra12Fafafa { font-family: "Chakra Petch", sans-serif; font-size: 12px; letter-spacing: 1px; }

        #metrics {
            position: fixed;
            left: -100000px;
            top: 0;
            white-space: pre;
            font: 12px monospace;
            color: transparent;
        }
    </style>
</head>
<body>
<div class="surface" id="surface">
    <div class="sample" id="arial13">5 ITEMS</div>
    <div class="sample" id="arial13Plain">5 ITEMS</div>
    <div class="sample" id="sans13">5 ITEMS</div>
    <div class="sample" id="chakra13">5 ITEMS</div>
    <div class="sample" id="arial10">256 KB</div>
    <div class="sample" id="arial12">SELECT FILE TO VIEW DETAILS</div>
    <div class="sample" id="chakra12">SELECT FILE TO VIEW DETAILS</div>
    <div class="sample" id="arial13White">5 ITEMS</div>
    <div class="sample on-fafafa" id="arial13Fafafa">5 ITEMS</div>
    <div class="sample" id="arial12White">SELECT FILE TO VIEW DETAILS</div>
    <div class="sample on-fafafa" id="arial12Fafafa">SELECT FILE TO VIEW DETAILS</div>
    <div class="sample" id="chakra12White">SELECT FILE TO VIEW DETAILS</div>
    <div class="sample on-fafafa" id="chakra12Fafafa">SELECT FILE TO VIEW DETAILS</div>
</div>
<pre id="metrics">BROWSER_FONT_RASTER_METRICS pending</pre>
<script>
    function rectPayload(rect) {
        return {
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height,
            right: rect.right,
            bottom: rect.bottom
        };
    }

    function stylePayload(element) {
        var style = getComputedStyle(element);
        return {
            color: style.color,
            backgroundColor: style.backgroundColor,
            fontFamily: style.fontFamily,
            fontSize: style.fontSize,
            fontWeight: style.fontWeight,
            lineHeight: style.lineHeight,
            letterSpacing: style.letterSpacing
        };
    }

    function collect() {
        var samples = {};
        Array.prototype.slice.call(document.querySelectorAll('.sample')).forEach(function(element) {
            samples[element.id] = {
                text: element.textContent,
                rect: rectPayload(element.getBoundingClientRect()),
                style: stylePayload(element)
            };
        });
        var result = {
            viewport: {
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                clientWidth: document.documentElement.clientWidth,
                clientHeight: document.documentElement.clientHeight,
                devicePixelRatio: window.devicePixelRatio
            },
            samples: samples
        };
        document.getElementById('metrics').textContent = 'BROWSER_FONT_RASTER_METRICS ' + JSON.stringify(result);
    }

    collect();
    requestAnimationFrame(function() {
        requestAnimationFrame(collect);
    });
</script>
</body>
</html>
