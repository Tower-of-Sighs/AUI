<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="aui-font-mode" content="web">
  <meta name="aui-viewport" content="mode=browser">
  <title>Ore Editable Tokens</title>
  <link rel="stylesheet" href="ore-edit.css">
</head>
<body class="ore-theme ore-edit-theme ore-showcase">
  <main class="container stack" style="padding-top: 24px; padding-bottom: 24px;">
    <section class="panel">
      <div class="panel-header"><h1>Editable Ore Tokens</h1></div>
      <div class="panel-body stack">
        <p class="text-muted">This page is the default visual baseline for ore-edit.css.</p>
        <div class="cluster">
          <button class="button button-primary">Primary</button>
          <button class="button button-secondary">Secondary</button>
          <button class="button button-danger">Danger</button>
        </div>
        <div class="grid">
          <div class="col-4"><div class="ore-swatch ore-swatch-green">Green</div></div>
          <div class="col-4"><div class="ore-swatch ore-swatch-purple">Purple</div></div>
          <div class="col-4"><div class="ore-swatch ore-swatch-gold">Gold</div></div>
        </div>
        <label class="form-group">
          <span class="form-label">Input</span>
          <input class="form-input" value="Ore edit baseline">
        </label>
      </div>
    </section>
  </main>
</body>
</html>
